        <div class="header_cart_div">
            <a href="cart.html" class="site_cart"><img src="img/cart_img.png" alt="カート"></a>
        </div>

     <!-- ★★★ PC専用メニューはここに置く ★★★ -->

</header>

<main class="purchase">

  <h1 class="purchase_title">ご購入手続き</h1>

  <section class="purchase_form">

    <label>お名前</label>
    <input type="text" id="userName">

    <label>郵便番号</label>
    <input type="text" id="userZip">

    <label>住所</label>
    <input type="text" id="userAddress">

    <label>電話番号</label>
    <input type="text" id="userTel">

    <label>メールアドレス</label>
    <input type="email" id="userMail">

  </section>

  <section class="payment_section">

  <h2 class="payment_title">お支払い方法</h2>

  <div class="payment_options">

    <label>
      <input type="radio" name="payment" value="credit" checked>
      クレジットカード
    </label>

    <label>
      <input type="radio" name="payment" value="bank">
      銀行振込
    </label>

    <label>
      <input type="radio" name="payment" value="cod">
      代金引換
    </label>

  </div>

  <button id="confirmBtn" class="confirm_btn">確認へ進む</button>
  <a href="cart.html" class="purchase_back_btn">カートに戻る</a>
  </section>
</main>
